# Render Blueprint: deploys the Express API + PostgreSQL for NutriBloom.
# Netlify keeps hosting the static client; set VITE_API_URL there to this API's URL.
databases:
  - name: nutribloom-db
    plan: free
    databaseName: nutribloom

services:
  - type: web
    name: nutribloom-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutribloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # paste your Netlify URL, e.g. https://cozy-capybara-d07d31.netlify.app
      - key: NODE_VERSION
        value: 22
